<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Blockheads 配方库 · 二进制提取版</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--panel2:#1d2129;--line:#2a2f3a;--text:#e6e9ef;
--dim:#8b93a5;--accent:#5aa9e6;--ok:#3ecf8e;--warn:#e0a458;--red:#e06c75}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
 font:14px/1.55 "Segoe UI",system-ui,-apple-system,"Microsoft YaHei",sans-serif}
header{padding:16px 22px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:17px;margin:0 0 4px;font-weight:600}
header .sub{color:var(--dim);font-size:12px}
.wrap{display:flex;min-height:calc(100vh - 76px)}
aside{width:280px;border-right:1px solid var(--line);background:var(--panel);padding:12px;
 overflow:auto;max-height:calc(100vh - 76px)}
main{flex:1;padding:18px 22px;overflow:auto;max-height:calc(100vh - 76px)}
input[type=search]{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);
 background:var(--panel2);color:var(--text);outline:none}
input[type=search]:focus{border-color:var(--accent)}
.bench{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;margin:5px 0;
 padding:8px 10px;border-radius:8px;border:1px solid transparent;background:transparent;
 color:var(--text);cursor:pointer;font-size:13px}
.bench:hover{background:var(--panel2)}
.bench.active{background:var(--panel2);border-color:var(--accent)}
.bench .n{color:var(--dim);font-size:11px}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.pill{padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);
 cursor:pointer;font-size:12px;color:var(--dim)}
.pill.on{border-color:var(--accent);color:var(--text)}
.note{color:var(--dim);font-size:12px}
h2{font-size:14px;margin:22px 0 10px;color:var(--accent);letter-spacing:.02em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card .out{font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.card .cnt{color:var(--dim);font-weight:400}
.card ul{margin:0;padding:0;list-style:none}
.card li{color:#c7cddb;padding:2px 0;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.card li b{color:var(--text);font-weight:500}
.badge{font-size:10px;padding:1px 6px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
.badge.derived{color:var(--ok);border-color:#245c45}
.badge.name_table{color:var(--warn);border-color:#5c4a24}
.time{font-size:11px;color:var(--dim);white-space:nowrap}
.up{background:linear-gradient(90deg,#1d2430,#171a21);border-style:dashed}
.up .out{color:var(--ok)}
.empty{color:var(--dim);padding:40px 0;text-align:center}
label.chk{display:flex;gap:6px;align-items:center;color:var(--dim);font-size:12px;cursor:pointer}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--dim)}
.tag{border:1px solid var(--line);border-radius:6px;padding:1px 6px}
</style>
</head>
<body>
<header>
  <h1>The Blockheads · 配方库<span class="sub" id="stat" style="margin-left:10px"></span></h1>
  <div class="legend">
    <span><i class="tag" style="color:var(--ok)">游戏内</i> 名字取自游戏 itemName(id) 函数（已用 42 条人工真值校验）</span>
    <span><i class="tag">耗时</i> 二进制 secondsRequired（游戏原值）</span>
  </div>
</header>
<div class="wrap">
  <aside>
    <input id="q" type="search" placeholder="搜索物品…">
    <div style="margin:12px 0 6px;color:var(--dim);font-size:11px;letter-spacing:.08em">工作台</div>
    <div id="benchlist"></div>
  </aside>
  <main>
    <div class="toolbar">
      <span class="pill on" data-m="normal">普通模式</span>
      <span class="pill" data-m="expert">专家模式</span>
      <label class="chk"><input type="checkbox" id="hideUp"> 隐藏升级条目</label>
      <span class="note" id="modeNote"></span>
    </div>
    <div id="content"></div>
  </main>
</div>

const rows = D.rows, benchNames = D.benches;
let curBench = null, curMode = "normal", query = "";

document.getElementById("stat").textContent = "· " + rows.length + " 条记录";

const counts = {};
rows.forEach(r => { counts[r.b] = counts[r.b] || {n:0, cert:true};
  counts[r.b].n++; if (!r.vcertain) counts[r.b].cert = false; });

const list = document.getElementById("benchlist");
Object.keys(counts).map(Number).sort((a,b)=>a-b).forEach(b => {
  const el = document.createElement("button");
  el.className = "bench"; el.dataset.b = b;
  el.innerHTML = "<span>" + (benchNames[b] || ("未识别类型 " + b)) + "</span>" +
                 '<span class="n">' + counts[b].n + "</span>";
  el.onclick = () => { curBench = b; render(); };
  list.appendChild(el);
});

document.querySelectorAll(".pill").forEach(p => p.onclick = () => {
  curMode = p.dataset.m;
  document.querySelectorAll(".pill").forEach(x=>x.classList.toggle("on", x===p));
  render();
});
document.getElementById("q").oninput = e => { query = e.target.value.trim().toLowerCase(); render(); };
document.getElementById("hideUp").onchange = render;

function badge(src){
  if (src === "derived") return '<span class="badge derived">游戏内</span>';
  return '<span class="badge">未知</span>';
}
const fmt = s => s ? s + "s" : "—";

function render(){
  document.querySelectorAll(".bench").forEach(e =>
    e.classList.toggle("active", +e.dataset.b === curBench));
  const main = document.getElementById("content");
  const note = document.getElementById("modeNote");
  if (curBench === null){
    main.innerHTML = '<div class="empty">← 从左侧选择工作台</div>';
    note.textContent = ""; return;
  }
  let sel = rows.filter(r => r.b === curBench && r.mode === curMode);
  if (!sel.length){ main.innerHTML = '<div class="empty">该模式没有记录</div>'; return; }
  const cert = sel[0].vcertain;
  note.innerHTML = cert ? "普通/专家 划分：已用 wiki + 人工真值验证"
    : '<span style="color:var(--warn)">普通/专家 划分：按材料量启发式推测，可能相反</span>';
  if (document.getElementById("hideUp").checked) sel = sel.filter(r => r.u === 0);
  if (query) sel = sel.filter(r => r.o.toLowerCase().includes(query) ||
      r.i.some(x => x[0].toLowerCase().includes(query)));
  if (!sel.length){ main.innerHTML = '<div class="empty">没有匹配的配方</div>'; return; }

  const byLevel = {};
  sel.forEach(r => (byLevel[r.l] = byLevel[r.l] || []).push(r));
  let html = "";
  Object.keys(byLevel).map(Number).sort((a,b)=>a-b).forEach(lv => {
    html += "<h2>Level " + lv + "</h2><div class='grid'>";
    byLevel[lv].sort((a,b)=>(a.idx ?? 0)-(b.idx ?? 0)).forEach(r => {
      if (r.u){
        html += '<div class="card up"><div class="out">升级 → L' + r.u +
                '<span class="time">' + fmt(r.s) + '</span></div><ul>' +
                r.i.map(x => "<li><b>" + x[0] + "</b><span>×" + x[1] + "</span></li>").join("") +
                "</ul></div>";
      } else {
        html += '<div class="card"><div class="out"><span>' + r.o +
                (r.oc>1 ? ' <span class="cnt">×'+r.oc+'</span>' : '') + '</span>' +
                '<span class="time">' + fmt(r.s) + '</span></div><ul>' +
                r.i.map(x => "<li><span><b>" + x[0] + "</b> " + badge(x[2]) +
                "</span><span>×" + x[1] + "</span></li>").join("") +
                "</ul></div>";
      }
    });
    html += "</div>";
  });
  main.innerHTML = html;
}
curBench = counts[2] ? 2 : Object.keys(counts).map(Number)[0];
render();
